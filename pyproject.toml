[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "Production-grade AI stock research agent using MCP and Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.99.0",
    "yfinance>=0.2.40",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "requests>=2.32.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "typer>=0.12.0",
]

[project.scripts]
finsight-research = "finsight.orchestrator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["finsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


